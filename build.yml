name: Compilar plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar
        run: mvn -B clean package
      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: AnunciosChat
          path: target/*.jar
